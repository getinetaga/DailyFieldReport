# Application Configuration for Daily Field Report
# Default configuration for development environment

# Application Information
app.name=Daily Field Report Management System
app.version=1.0.0
app.description=Professional field reporting system for construction and project management

# Logging Configuration
logging.level.root=INFO
logging.level.com.fieldreport=DEBUG
logging.file.name=logs/daily-field-report.log
logging.file.max-size=10MB
logging.file.max-history=30

# Export Configuration
export.directory=exports
export.max.file.size=50MB
export.retention.days=90

# Application Behavior
app.auto.save=true
app.validation.strict=true
app.backup.enabled=true
app.backup.interval=24h

# Performance Settings
app.max.reports=1000
app.memory.limit=512MB
app.concurrent.exports=3