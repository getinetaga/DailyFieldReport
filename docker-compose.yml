# Docker Compose for Daily Field Report Application
version: '3.8'

services:
  # Application Service
  daily-field-report:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daily-field-report-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx1g -Xms512m
      - SERVER_PORT=8080
      - LOGGING_LEVEL_ROOT=INFO
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./exports:/app/exports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - field-report-network

  # Database Service (if needed in future)
  postgres:
    image: postgres:15-alpine
    container_name: daily-field-report-db
    environment:
      POSTGRES_DB: fieldreport
      POSTGRES_USER: fieldreport
      POSTGRES_PASSWORD: fieldreport123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldreport -d fieldreport"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - field-report-network

  # Redis Cache Service (for session storage)
  redis:
    image: redis:7-alpine
    container_name: daily-field-report-redis
    command: redis-server --appendonly yes --requirepass fieldreport123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - field-report-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: daily-field-report-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - daily-field-report
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - field-report-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: daily-field-report-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - field-report-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: daily-field-report-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - field-report-network

# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Networks
networks:
  field-report-network:
    driver: bridge
    name: field-report-network