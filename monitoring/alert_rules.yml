# Alert Rules for Daily Field Report
groups:
  - name: daily_field_report_alerts
    rules:
      # Application Health
      - alert: ApplicationDown
        expr: up{job="daily-field-report"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Daily Field Report application is down"
          description: "The Daily Field Report application has been down for more than 1 minute"

      # High CPU Usage
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="daily-field-report"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80% for more than 5 minutes"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes{job="daily-field-report"} / jvm_memory_max_bytes{job="daily-field-report"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is above 85% for more than 5 minutes"

      # High Response Time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="daily-field-report"}[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is above 2 seconds for more than 3 minutes"

      # Database Connection Issues
      - alert: DatabaseConnectionError
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failed"
          description: "Cannot connect to PostgreSQL database"

      # Redis Connection Issues
      - alert: RedisConnectionError
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis connection failed"
          description: "Cannot connect to Redis cache"

      # Disk Space Warning
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is below 20% on {{ $labels.device }}"

      # Error Rate Alert
      - alert: HighErrorRate
        expr: (rate(http_server_requests_seconds_count{status=~"4.*|5.*",job="daily-field-report"}[5m]) / rate(http_server_requests_seconds_count{job="daily-field-report"}[5m])) * 100 > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for more than 3 minutes"