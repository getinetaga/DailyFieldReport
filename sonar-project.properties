# SonarQube Configuration for Daily Field Report

# Project Information
sonar.projectKey=daily-field-report
sonar.projectName=Daily Field Report
sonar.projectVersion=1.0.0

# Source and Test Directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=java

# Coverage Reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Exclusions
sonar.exclusions=**/target/**,**/*.xml,**/*.txt,**/*.md
sonar.test.exclusions=**/target/**

# Quality Gate
sonar.qualitygate.wait=true

# Analysis Parameters
sonar.java.source=23
sonar.java.target=23