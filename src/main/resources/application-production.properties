# Production Configuration for Daily Field Report
# Override settings for production environment

# Logging Configuration - More restrictive for production
logging.level.root=WARN
logging.level.com.fieldreport=INFO
logging.file.name=/var/log/daily-field-report/app.log
logging.file.max-size=50MB
logging.file.max-history=90

# Export Configuration - Production settings
export.directory=/var/data/exports
export.max.file.size=100MB
export.retention.days=365

# Application Behavior - Production optimized
app.auto.save=true
app.validation.strict=true
app.backup.enabled=true
app.backup.interval=12h

# Performance Settings - Production scale
app.max.reports=10000
app.memory.limit=2GB
app.concurrent.exports=5

# Security Settings
security.enabled=true
security.audit.log=true
security.session.timeout=30m